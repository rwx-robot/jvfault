name: Release

# 触发：推送 v* 格式的 tag（如 v1.0.5）
# 作用：自动创建 GitHub Release + 附加所有 jvfault-*.jar 构件 + 触发 Sonatype 同步（后续可加）
on:
  push:
    tags: [ 'v*' ]

# 与 CI 互斥：tag push 不重复跑普通 CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 创建 release 需要写权限

jobs:
  release:
    name: Build & publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 完整构建（与 CI 同步的基线）→ 产物已写入 build/libs/
      - name: Build all jars
        run: ./gradlew jar --no-daemon

      # 把所有主构件 + sources + javadoc 收集到 staging 目录
      - name: Stage release artifacts
        run: |
          mkdir -p release-staging
          find . -path '*/build/libs/jvfault-*.jar' \
              -not -name '*-sources.jar' \
              -not -name '*-javadoc.jar' \
              -exec cp -v {} release-staging/ \;
          ls -la release-staging/

      - name: Extract CHANGELOG entry for this version
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # CHANGELOG 行形如 "## [v1.0.5] - ..."；以 'v' 前缀查子串，确保精确匹配
          awk -v v="v$VERSION" '
            /^## \[v[0-9]/ {
              if (in_block) exit
              if (index($0, "[" v "]") > 0) in_block = 1
            }
            in_block { print }
          ' CHANGELOG.md > release-notes.md
          echo "## Release notes (auto-extracted from CHANGELOG.md)" > /tmp/release-notes-header.md
          # 兜底：若 CHANGELOG 没这一版本，至少给个最小说明
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry for v$VERSION — see CHANGELOG.md for full history." > release-notes.md
          fi
          cat /tmp/release-notes-header.md release-notes.md > /tmp/final-notes.md
          mv /tmp/final-notes.md release-notes.md
          echo "release_notes<<EOF" >> "$GITHUB_OUTPUT"
          cat release-notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.release_notes }}
          # 始终发布到 GitHub Release（即使是预发布版本 tag）
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          fail_on_unmatched_files: true
          files: |
            release-staging/*.jar

      - name: Summary
        if: always()
        run: |
          echo "### Release ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "✓ GitHub Release created with $(ls release-staging/ | wc -l | tr -d ' ') jars" >> $GITHUB_STEP_SUMMARY
