name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 临时：contents: write 用于把构建日志推到 ci-debug 分支（排查完即撤）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "nc -z localhost 4222"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      mosquitto:
        image: eclipse-mosquitto:1.6
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_pub -h localhost -t health -m ok"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      JVFAULT_REDIS_BOOTSTRAP: redis://127.0.0.1:6379
      JVFAULT_RMQ_BOOTSTRAP: amqp://localhost:5672
      JVFAULT_NATS_BOOTSTRAP: nats://localhost:4222
      JVFAULT_MQTT_BOOTSTRAP: tcp://localhost:1883

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and test
        id: build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee /tmp/gradle.log

      # ---- 临时调试：把日志推送到 ci-debug 分支（只读访问即可查看） ----
      - name: Publish build log to ci-debug branch
        if: always()
        continue-on-error: true
        run: |
          set -x
          echo "== failing test xml files =="
          grep -rl 'failures="[1-9]\|errors="[1-9]' \
            --include='TEST-*.xml' "${{ github.workspace }}" || true
          echo "== failure messages =="
          for f in $(grep -rl 'failures="[1-9]\|errors="[1-9]' \
                       --include='TEST-*.xml' "${{ github.workspace }}" || true); do
            echo "### $f"
            sed -n 's/.*<\(failure\|error\) message="\([^"]*\)".*/  - \2/p' "$f" | head -30
          done

          mkdir -p /tmp/dbg && cd /tmp/dbg
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin main
          git checkout -q -b ci-debug
          mkdir -p ci-debug
          {
            echo "sha: ${{ github.sha }}"
            echo "cwd jars:"
            ls -1 "${{ github.workspace }}"/*/build/libs/jvfault-*[0-9].jar 2>/dev/null | wc -l
            echo
            echo "=========== failing tests ==========="
            for f in $(grep -rl 'failures="[1-9]\|errors="[1-9]' \
                         --include='TEST-*.xml' "${{ github.workspace }}" || true); do
              echo "### $f"
              sed -n 's/.*<\(failure\|error\) message="\([^"]*\)".*/  - \2/p' "$f" | head -30
            done
            echo
            echo "=========== gradle log tail (250) ==========="
            tail -n 250 /tmp/gradle.log
          } > ci-debug/latest.txt
          git add ci-debug/latest.txt
          git -c user.email=ci@local -c user.name=ci commit -q -m "ci-debug: ${{ github.sha }}"
          git push -q -f origin ci-debug && echo "PUSHED ci-debug"

      - name: Verify publishing to Maven Local
        if: steps.build.conclusion == 'success'
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: '**/build/reports/jacoco'
          if-no-files-found: ignore