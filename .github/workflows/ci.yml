name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # 临时只启用 redis 一个 service —— 排查哪个 service 让 'Initialize containers' 失败
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      JVFAULT_REDIS_BOOTSTRAP: redis://127.0.0.1:6379
      JVFAULT_KAFKA_BOOTSTRAP: localhost:9092
      JVFAULT_RMQ_BOOTSTRAP: amqp://localhost:5672
      JVFAULT_NATS_BOOTSTRAP: nats://localhost:4222
      JVFAULT_MQTT_BOOTSTRAP: tcp://localhost:1883

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore