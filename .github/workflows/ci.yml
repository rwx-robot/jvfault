name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# 同一 ref 的多次运行互斥：新 push 取消同 ref 上仍在排队的旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 收紧 GITHUB_TOKEN 权限（GitHub 建议默认 read-only + 显式声明写权限）
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # 真实 broker：让传输集成测试连真服务，而不是靠 Docker 自行拉起容器。
    # 已接入 redis / kafka / rabbitmq / nats / mosquitto；gRPC 走本机回环无需 service。
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      kafka:
        image: apache/kafka:3.7.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "nc -z localhost 4222"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      mosquitto:
        image: eclipse-mosquitto:1.6
        ports:
          - 1883:1883
        options: >-
          --health-cmd "mosquitto_pub -h localhost -t health -m ok"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      JVFAULT_REDIS_BOOTSTRAP: redis://127.0.0.1:6379
      JVFAULT_KAFKA_BOOTSTRAP: localhost:9092
      JVFAULT_RMQ_BOOTSTRAP: amqp://localhost:5672
      JVFAULT_NATS_BOOTSTRAP: nats://localhost:4222
      JVFAULT_MQTT_BOOTSTRAP: tcp://localhost:1883

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Verify publishing to Maven Local
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore
