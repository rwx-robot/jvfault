name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# 简化版 CI（排查中）：无 concurrency、无 permissions 收紧、无 service
jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # 服务未起 —— 各 transport-* 集成测试假设 broker 不可达时跳过（assumeTrue）
      JVFAULT_KAFKA_BOOTSTRAP: localhost:9092
      JVFAULT_RMQ_BOOTSTRAP: amqp://localhost:5672
      JVFAULT_NATS_BOOTSTRAP: nats://localhost:4222
      JVFAULT_MQTT_BOOTSTRAP: tcp://localhost:1883

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build and test (no service containers)
        run: ./gradlew build --no-daemon
      - name: Verify publishing to Maven Local
        run: ./gradlew publishToMavenLocal --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore