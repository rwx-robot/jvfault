name: CI-minimal

on:
  push:
    branches: [ main ]

jobs:
  test-no-broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build without broker services
        run: ./gradlew build --no-daemon -x test